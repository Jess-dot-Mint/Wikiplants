{% extends "base.html" %}
{% import 'macros.html' as macros %}
{% block title %}Plantas{% endblock %}

{% block content %}
<div class="container">
    <h1>🌿 Todas las plantas</h1>
    
    <div class="search-section">
        <form action="{{ url_for('views.buscar') }}" method="GET" class="search-box">
            <input type="text" name="q" placeholder="Buscar por nombre común o científico..." value="{{ busqueda or '' }}">
            <button type="submit">🔍 Buscar</button>
        </form>
        
        <div class="filtros">
            <a href="{{ url_for('views.buscar', q=busqueda or '') }}" class="filtro-btn {% if not filtro_activo %}active{% endif %}">Todos</a>
            <a href="{{ url_for('views.buscar', q=busqueda or '', filtro='medicinal') }}" class="filtro-btn {% if filtro_activo == 'medicinal' %}active{% endif %}">💊 Medicinales</a>
            <a href="{{ url_for('views.buscar', q=busqueda or '', filtro='cosmetico') }}" class="filtro-btn {% if filtro_activo == 'cosmetico' %}active{% endif %}">🧴 Cosmética</a>
            <a href="{{ url_for('views.buscar', q=busqueda or '', filtro='ambos') }}" class="filtro-btn {% if filtro_activo == 'ambos' %}active{% endif %}">✨ Ambos</a>
        </div>
    </div>
    
    <div class="plantas-grid">
        {% for planta in plantas %}

            {{ macros.planta_card(planta) }}
       
        {% endfor %}


    </div>
</div>


{% endblock %}
