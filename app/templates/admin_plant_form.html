{% extends "base.html" %}

{% block title %}{% if planta %}Editar{% else %}Nueva{% endif %} planta{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px;">
    <div class="ficha-planta">
        <h1>{% if planta %}✏️ Editar{% else %}➕ Nueva{% endif %} planta</h1>
        
        <form method="POST">
            <div style="margin-bottom: 1rem;">
                <label><strong>Nombre común *</strong></label>
                <input type="text" name="nombre_comun" value="{{ planta.nombre_comun if planta else '' }}" required style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Nombre científico</strong></label>
                <input type="text" name="nombre_cientifico" value="{{ planta.nombre_cientifico if planta else '' }}" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Familia</strong></label>
                <input type="text" name="familia" value="{{ planta.familia if planta else '' }}" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Propiedades medicinales</strong></label>
                <textarea name="propiedades_medicinales" rows="3" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">{{ planta.propiedades_medicinales if planta else '' }}</textarea>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Propiedades cosméticas</strong></label>
                <textarea name="propiedades_cosmeticas" rows="3" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">{{ planta.propiedades_cosmeticas if planta else '' }}</textarea>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Partes usadas</strong></label>
                <input type="text" name="partes_usadas" value="{{ planta.partes_usadas if planta else '' }}" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Formas de uso</strong></label>
                <input type="text" name="formas_uso" value="{{ planta.formas_uso if planta else '' }}" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Contraindicaciones</strong></label>
                <textarea name="contraindicaciones" rows="2" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">{{ planta.contraindicaciones if planta else '' }}</textarea>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>Historia / curiosidades</strong></label>
                <textarea name="historia" rows="4" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">{{ planta.historia if planta else '' }}</textarea>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label><strong>URL de la imagen</strong></label>
                <input type="text" name="imagen_url" value="{{ planta.imagen_url if planta else '' }}" placeholder="https://..." style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 8px;">
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn">💾 Guardar</button>
                <a href="/admin" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
